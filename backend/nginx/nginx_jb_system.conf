# ==============================================================================
# JB GROUP ENTERPRISE ERP — Nginx Reverse Proxy Configuration
# Prevents HTTP 413 (Request Entity Too Large) for Receipt & Image Uploads
# ==============================================================================

# Recommended placement:
# Option A (Global): Inside /etc/nginx/nginx.conf within the http { ... } block
# Option B (Site-specific): Inside /etc/nginx/sites-available/jb-system within server { ... }

server {
    server_name your-domain.com; # Replace with your actual domain or IP

    # Set maximum upload body size to 25 Megabytes (allows full resolution receipts)
    client_max_body_size 25M;
    client_body_buffer_size 1M;
    client_body_timeout 120s;

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep upload limit consistent for API endpoints
        client_max_body_size 25M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded media & receipts
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25M;
    }

    # Frontend Single Page App (Vite build)
    location / {
        root /var/www/jb-system/dist; # Path to built frontend
        try_files $uri $uri/ /index.html;
    }
}
